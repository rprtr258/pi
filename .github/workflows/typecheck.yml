name: typecheck

on:
  push:
    branches: [master]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # Single shared package.json for all extensions (agent/extensions);
      # per-extension deps were merged into it.
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: agent/extensions

      - name: Typecheck
        run: bun check -p .
        working-directory: agent/extensions
